<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WE</title>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo-con">
        <img src="images/logo.png" alt="logo">
        <div>
          <span>WE School</span>
          <span>Applied Technology</span>
        </div>
      </div>

      <div class="link-con">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
      </div>
    </nav>
  </header>

  <main>
    <form action="index.html">
      <h1>Login</h1>
      <div class="inp-con">
        <label for="username">Username</label>
        <input type="text" placeholder="Enter your username" required>
      </div>

      <div class="inp-con">
        <label for="password">Password</label>
        <input type="password" placeholder="Enter your password" required>
      </div>

      <span>Don't have an account? <a href="register.html">Register one</a></span>

      <button class="sub-btn" type="submit">Submit</button>
    </form>
  </main>

  <footer>
    <span>&copy; Copyright T3CHN0. All rights reserved.</span>
  </footer>
</body>
</html>
